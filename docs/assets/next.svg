<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 276" width="900" height="276" role="img" aria-label="Animation: after a reply, a box lists up to three suggested next prompts with number keys. Pressing 2 highlights that suggestion and puts it in the prompt box as an editable draft with a blinking cursor. Zero dismisses the box.">
<style>
text{font:15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;dominant-baseline:middle}
.next0{animation:knext0 12s linear infinite}@keyframes knext0{0%,30.00%{opacity:0}30.01%,100%{opacity:1}}
.next1{animation:knext1 12s linear infinite}@keyframes knext1{0%,44.90%{opacity:1}44.91%,100%{opacity:0}}
.next2{animation:knext2 12s linear infinite}@keyframes knext2{0%,45.00%{opacity:0}45.01%,100%{opacity:1}}
@keyframes caret{50%{fill:transparent}}
.next3{animation:knext3 12s linear infinite}@keyframes knext3{0%,29.90%{opacity:1}29.91%,100%{opacity:0}}
.next4{animation:knext4 12s linear infinite}@keyframes knext4{0%,30.00%{opacity:0}30.01%,44.90%{opacity:1}44.91%,100%{opacity:0}}
.next5{animation:knext5 12s linear infinite}@keyframes knext5{0%,45.00%{opacity:0}45.01%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ph{animation:none;opacity:0}.last{opacity:1}.drain{animation:none;transform:scaleX(.1)}.still{animation:none}}
</style>

<rect width="900" height="276" rx="14" fill="#161616"/><rect x="6" y="8" width="888" height="260" rx="10" fill="#212121"/>
<rect x="18" y="20" width="864" height="128" rx="10" fill="none" stroke="#8a8a95" stroke-width="1.2"/>
<text x="30" y="42" fill="#8c8c8c" style="font-size:14px;">next:</text>
<rect x="52" y="57" width="18" height="18" rx="4" fill="none" stroke="#4a4a4a"/><text x="61" y="66" fill="#8c8c8c" text-anchor="middle" style="font-size:12px;">1</text><text x="80" y="66" fill="#e8e6e1">Run the tests and fix any failures</text>
<rect x="52" y="79" width="18" height="18" rx="4" fill="none" stroke="#4a4a4a"/><text x="61" y="88" fill="#8c8c8c" text-anchor="middle" style="font-size:12px;">2</text><text x="80" y="88" fill="#e8e6e1">Review the diff before I commit</text>
<rect x="52" y="101" width="18" height="18" rx="4" fill="none" stroke="#4a4a4a"/><text x="61" y="110" fill="#8c8c8c" text-anchor="middle" style="font-size:12px;">3</text><text x="80" y="110" fill="#e8e6e1">Open a pull request</text>
<rect x="52" y="123" width="18" height="18" rx="4" fill="none" stroke="#4a4a4a"/><text x="61" y="132" fill="#8c8c8c" text-anchor="middle" style="font-size:12px;">0</text><text x="80" y="132" fill="#8c8c8c">dismiss</text>
<g class="next0 ph last"><rect x="42" y="76" width="360" height="24" rx="6" fill="#2d2a4a"/><rect x="52" y="79" width="18" height="18" rx="4" fill="#8B7CF6" stroke="#8B7CF6"/><text x="61" y="88" fill="#fff" text-anchor="middle" style="font-size:12px;">2</text><text x="80" y="88" fill="#fff">Review the diff before I commit</text></g>
<rect x="18" y="168" width="864" height="46" rx="10" fill="#1b1b1b" stroke="#3a3a3a"/><text x="38" y="191" fill="#8B7CF6" style="font-weight:700">❯</text>
<g class="next1 ph"><text x="62" y="191" fill="#66666a">Try &quot;how do I log an error?&quot;</text></g>
<g class="next2 ph last"><text x="62" y="191" fill="#e8e6e1">Review the diff before I commit<tspan class="still" fill="#8B7CF6" style="animation:caret 1s steps(1) infinite">▍</tspan></text></g>
<g class="next3 ph"><text x="24" y="246" fill="#8c8c8c" style="font-size:14px;">After each reply: up to three suggested next prompts.</text></g>
<g class="next4 ph"><text x="24" y="246" fill="#8c8c8c" style="font-size:14px;">Press 1, 2 or 3 to pick one.</text></g>
<g class="next5 ph last"><text x="24" y="246" fill="#8c8c8c" style="font-size:14px;">It lands in the prompt as a draft. Edit it, or just send. 0 dismisses.</text></g>
</svg>
