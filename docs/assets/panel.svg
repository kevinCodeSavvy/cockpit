<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" role="img" aria-label="Animation: the cockpit panel in Claude Code Desktop. A box of three suggested next prompts sits above Deck. Deck shows the Jev model route with its effort and confidence, the context window, the 5-hour and 7-day limits, session spend, tokens in and out, and a prompt-cache bar that drains while the route row changes from a low-effort sonnet decision to a high-effort opus one.">
