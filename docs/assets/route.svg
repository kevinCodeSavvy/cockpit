<g class="route0 ph"><text x="20" y="64" fill="#e8e6e1" textLength="265.2" lengthAdjust="spacing" xml:space="preserve" >❯ fix the typo in the README intro</text><text x="196" y="100" fill="#77756f" textLength="39.0" lengthAdjust="spacing" xml:space="preserve" >opus </text><text x="235" y="100" fill="#9a9893" textLength="15.6" lengthAdjust="spacing" xml:space="preserve" >= </text><rect x="250.6" y="91" width="46.8" height="18" rx="4" fill="#EBA83A"/><text x="250.6" y="100" fill="#1e1e1e" textLength="46.8" lengthAdjust="spacing" xml:space="preserve" font-weight="700"> opus </text><text x="297.4" y="100" fill="#77756f" textLength="195.0" lengthAdjust="spacing" xml:space="preserve" > jev: haiku · not applied</text><text x="492.4" y="100" fill="#9a9893" textLength="70.2" lengthAdjust="spacing" xml:space="preserve" >  effort </text><text x="562.6" y="100" fill="#9C95EC" textLength="7.8" lengthAdjust="spacing" xml:space="preserve" >▁</text><text x="570.4" y="100" fill="#77756f" textLength="54.6" lengthAdjust="spacing" xml:space="preserve" >··· low</text><text x="625" y="100" fill="#5DCAA5" textLength="85.8" lengthAdjust="spacing" xml:space="preserve" >  conf 0.93</text><text x="710.8" y="100" fill="#77756f" textLength="54.6" lengthAdjust="spacing" xml:space="preserve" >  210ms</text><rect x="806" y="96.5" width="7" height="7" rx="2" fill="none" stroke="#5DCAA5" stroke-width="1.5"/></g>
<g class="route1 ph"><text x="20" y="64" fill="#e8e6e1" textLength="210.6" lengthAdjust="spacing" xml:space="preserve" >❯ what does parseConfig do?</text><text x="196" y="100" fill="#77756f" textLength="39.0" lengthAdjust="spacing" xml:space="preserve" >opus </text><text x="235" y="100" fill="#9a9893" textLength="15.6" lengthAdjust="spacing" xml:space="preserve" >= </text><rect x="250.6" y="91" width="46.8" height="18" rx="4" fill="#EBA83A"/><text x="250.6" y="100" fill="#1e1e1e" textLength="46.8" lengthAdjust="spacing" xml:space="preserve" font-weight="700"> opus </text><text x="297.4" y="100" fill="#77756f" textLength="202.8" lengthAdjust="spacing" xml:space="preserve" > jev: sonnet · not applied</text><text x="500.19999999999993" y="100" fill="#9a9893" textLength="70.2" lengthAdjust="spacing" xml:space="preserve" >  effort </text><text x="570.4" y="100" fill="#9C95EC" textLength="15.6" lengthAdjust="spacing" xml:space="preserve" >▁▃</text><text x="586" y="100" fill="#77756f" textLength="70.2" lengthAdjust="spacing" xml:space="preserve" >·· medium</text><text x="656.2" y="100" fill="#5DCAA5" textLength="85.8" lengthAdjust="spacing" xml:space="preserve" >  conf 0.74</text><text x="742" y="100" fill="#77756f" textLength="54.6" lengthAdjust="spacing" xml:space="preserve" >  190ms</text><rect x="806" y="96.5" width="7" height="7" rx="2" fill="none" stroke="#5DCAA5" stroke-width="1.5"/><rect x="819" y="96.5" width="7" height="7" rx="2" fill="none" stroke="#9C95EC" stroke-width="1.5"/></g>
