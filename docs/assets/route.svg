<g class="route3 ph"><text x="20" y="150" fill="#77756f" textLength="686.4" lengthAdjust="spacing" xml:space="preserve" >Easy: Jev suggests haiku, but the main model is kept by default (routeMainModel is off).</text></g>
<g class="route4 ph"><text x="20" y="150" fill="#77756f" textLength="343.2" lengthAdjust="spacing" xml:space="preserve" >A question: medium effort, lower confidence.</text></g>
<g class="route5 ph last"><text x="20" y="150" fill="#E2706F" textLength="608.4" lengthAdjust="spacing" xml:space="preserve" >Risky and hard: more reasoning effort, flagged. Filled square = model applied.</text></g>
<text x="20" y="174" fill="#77756f" textLength="858.0" lengthAdjust="spacing" xml:space="preserve" >Outlined squares are suggestions that were not applied. No key: the built-in classifier, no confidence figure.</text>
