<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 196" width="900" height="196" role="img" aria-label="Animation: the Model route row, shown for three prompts. A small fix is judged easy: Jev suggests haiku and low effort, the main model is kept. A question gets medium effort. A risky database migration gets extra high effort and a risk flag. Each decision adds a square to the history at the end of the row.">
<style>
text{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;dominant-baseline:middle}
.route0{animation:kroute0 15s linear infinite}@keyframes kroute0{0%,33.00%{opacity:1}33.01%,100%{opacity:0}}
.route1{animation:kroute1 15s linear infinite}@keyframes kroute1{0%,33.00%{opacity:0}33.01%,66.00%{opacity:1}66.01%,100%{opacity:0}}
.route2{animation:kroute2 15s linear infinite}@keyframes kroute2{0%,66.00%{opacity:0}66.01%,100%{opacity:1}}
.route3{animation:kroute3 15s linear infinite}@keyframes kroute3{0%,32.90%{opacity:1}32.91%,100%{opacity:0}}
.route4{animation:kroute4 15s linear infinite}@keyframes kroute4{0%,33.00%{opacity:0}33.01%,65.90%{opacity:1}65.91%,100%{opacity:0}}
.route5{animation:kroute5 15s linear infinite}@keyframes kroute5{0%,66.00%{opacity:0}66.01%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ph{animation:none;opacity:0}.last{opacity:1}.drain{animation:none;transform:scaleX(.1)}.still{animation:none}}
</style>
